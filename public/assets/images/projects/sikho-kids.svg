<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021" />
      <stop offset="50%" stop-color="#19152b" />
      <stop offset="100%" stop-color="#0d0e1c" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="skGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#skBg)" rx="16"/>

  <circle cx="200" cy="100" r="180" fill="#f59e0b" opacity="0.1" filter="url(#skGlow)"/>
  <circle cx="650" cy="380" r="190" fill="#ec4899" opacity="0.1" filter="url(#skGlow)"/>

  <!-- Mobile Mockup 1 (Center Left) -->
  <g transform="translate(180, 50)">
    <rect x="0" y="0" width="200" height="400" rx="32" fill="#090a12" stroke="#2a2e45" stroke-width="3"/>
    <!-- Phone Notch -->
    <rect x="55" y="10" width="90" height="18" rx="9" fill="#141724"/>
    
    <!-- Screen Content -->
    <rect x="12" y="38" width="176" height="348" rx="22" fill="#121629"/>
    <!-- App Header -->
    <text x="30" y="70" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="14">Sikho Kids</text>
    <circle cx="160" cy="65" r="10" fill="#f59e0b"/>
    
    <!-- Card: Daily Phonics -->
    <rect x="22" y="90" width="156" height="110" rx="14" fill="url(#amberGrad)" opacity="0.9"/>
    <text x="36" y="125" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="15">Alphabet Magic</text>
    <text x="36" y="145" fill="rgba(255,255,255,0.85)" font-family="sans-serif" font-size="11">AI Voice Phonics</text>
    <rect x="36" y="160" width="70" height="24" rx="12" fill="#ffffff" />
    <text x="71" y="176" fill="#b45309" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">PLAY NOW</text>

    <!-- Games Grid -->
    <rect x="22" y="215" width="72" height="75" rx="12" fill="#1e2540"/>
    <text x="58" y="258" fill="#f8fafc" font-family="sans-serif" font-size="24" text-anchor="middle">🎨</text>
    
    <rect x="104" y="215" width="74" height="75" rx="12" fill="#1e2540"/>
    <text x="141" y="258" fill="#f8fafc" font-family="sans-serif" font-size="24" text-anchor="middle">🔢</text>

    <rect x="22" y="302" width="156" height="60" rx="12" fill="#1e2540"/>
    <text x="36" y="326" fill="#cbd5e1" font-family="sans-serif" font-size="11">Parental Control</text>
    <text x="36" y="346" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">Screen time: 45m</text>
  </g>

  <!-- Mobile Mockup 2 (Center Right, Angled) -->
  <g transform="translate(430, 70)">
    <rect x="0" y="0" width="190" height="370" rx="28" fill="#090a12" stroke="#333852" stroke-width="2.5"/>
    <rect x="50" y="10" width="90" height="16" rx="8" fill="#141724"/>

    <rect x="10" y="35" width="170" height="320" rx="20" fill="#14182b"/>
    <text x="25" y="65" fill="#ec4899" font-family="sans-serif" font-weight="bold" font-size="13">Speech Evaluator</text>
    
    <!-- Audio Waveform Visualizer -->
    <rect x="25" y="85" width="140" height="85" rx="10" fill="#0e1120"/>
    <path d="M 35,128 Q 50,95 65,128 T 95,128 T 125,128 T 155,128" fill="none" stroke="#ec4899" stroke-width="3"/>
    <text x="95" y="155" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Accuracy: 96.8% (A+)</text>

    <!-- Badges Earned -->
    <rect x="25" y="185" width="140" height="50" rx="10" fill="url(#pinkGrad)" opacity="0.2"/>
    <text x="38" y="208" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold">Star Reader Badge</text>
    <text x="38" y="224" fill="#a78bfa" font-family="sans-serif" font-size="9">Level 4 Completed</text>

    <!-- Subscription Card -->
    <rect x="25" y="248" width="140" height="60" rx="10" fill="#1e2540"/>
    <text x="38" y="272" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">Premium Active</text>
    <text x="38" y="290" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Razorpay Auto-Renew</text>
  </g>
</svg>
