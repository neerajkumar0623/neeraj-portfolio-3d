<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="tfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0f1126" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>
    <linearGradient id="tfViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="tfTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="tfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#tfBg)" rx="16"/>

  <circle cx="680" cy="120" r="160" fill="#8b5cf6" opacity="0.12" filter="url(#tfGlow)"/>
  <circle cx="120" cy="380" r="150" fill="#06b6d4" opacity="0.1" filter="url(#tfGlow)"/>

  <!-- Window Chrome -->
  <rect x="40" y="35" width="720" height="430" rx="12" fill="#0b0e1b" stroke="rgba(139, 92, 246, 0.25)" stroke-width="1"/>

  <!-- Header Bar -->
  <rect x="40" y="35" width="720" height="45" rx="12" fill="#0f1428"/>
  <circle cx="65" cy="58" r="5" fill="#ef4444" />
  <circle cx="82" cy="58" r="5" fill="#eab308" />
  <circle cx="99" cy="58" r="5" fill="#10b981" />
  <text x="130" y="62" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="13">TRADEFLOW / TRADENTIX ERP</text>
  <text x="730" y="62" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">v2.4.8 ENTERPRISE</text>

  <!-- Sub Navigation -->
  <rect x="40" y="80" width="720" height="35" fill="#080b16" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <text x="70" y="102" fill="#8b5cf6" font-family="sans-serif" font-size="11" font-weight="bold">Containers &amp; Freight</text>
  <text x="210" y="102" fill="#94a3b8" font-family="sans-serif" font-size="11">Customs Clearance</text>
  <text x="340" y="102" fill="#94a3b8" font-family="sans-serif" font-size="11">Multi-Currency Invoices</text>
  <text x="500" y="102" fill="#94a3b8" font-family="sans-serif" font-size="11">Warehouse Ledgers</text>

  <!-- World Shipping Map Area -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="460" height="200" rx="8" fill="#070a14" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <text x="20" y="30" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Ocean Freight GPS Tracking</text>
    
    <!-- Geo lines -->
    <path d="M 50,140 Q 180,60 280,100 T 410,70" fill="none" stroke="url(#tfViolet)" stroke-width="2.5" stroke-dasharray="6,4"/>
    
    <!-- Waypoints -->
    <circle cx="50" cy="140" r="6" fill="#06b6d4"/>
    <text x="50" y="165" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Dubai (DXB)</text>

    <circle cx="280" cy="100" r="7" fill="#8b5cf6" filter="url(#tfGlow)"/>
    <text x="280" y="80" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">MSC GULSUN (In-Transit)</text>

    <circle cx="410" cy="70" r="6" fill="#10b981"/>
    <text x="410" y="95" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Rotterdam (RTM)</text>
  </g>

  <!-- Right Telemetry Panel -->
  <g transform="translate(540, 130)">
    <rect x="0" y="0" width="200" height="200" rx="8" fill="#070a14" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <text x="16" y="30" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Financial Ledgers</text>
    
    <text x="16" y="65" fill="#94a3b8" font-family="sans-serif" font-size="11">Total Invoice Value</text>
    <text x="16" y="90" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold">$2,845,900</text>
    <text x="16" y="110" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">99.98% Reconciled</text>

    <rect x="16" y="130" width="168" height="50" rx="6" fill="#0e1327"/>
    <text x="28" y="152" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="bold">Customs Duty Saved</text>
    <text x="28" y="168" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">€148,250 via automated HS code</text>
  </g>

  <!-- Cargo Data Table Preview -->
  <g transform="translate(60, 345)">
    <rect x="0" y="0" width="680" height="100" rx="8" fill="#070a14" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    
    <!-- Table Header -->
    <rect x="0" y="0" width="680" height="28" rx="8" fill="#0e1428"/>
    <text x="20" y="18" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">BILL OF LADING</text>
    <text x="180" y="18" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">VESSEL / CARRIER</text>
    <text x="340" y="18" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">ORIGIN / DEST</text>
    <text x="500" y="18" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">STATUS</text>

    <!-- Row 1 -->
    <text x="20" y="52" fill="#8b5cf6" font-family="'JetBrains Mono', monospace" font-size="11">BL-98421-IN</text>
    <text x="180" y="52" fill="#cbd5e1" font-family="sans-serif" font-size="11">Maersk Mc-Kinney</text>
    <text x="340" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11">Mumbai &rarr; Hamburg</text>
    <rect x="500" y="40" width="80" height="18" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="540" y="53" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">CLEARED</text>

    <!-- Row 2 -->
    <text x="20" y="80" fill="#8b5cf6" font-family="'JetBrains Mono', monospace" font-size="11">BL-98422-DE</text>
    <text x="180" y="80" fill="#cbd5e1" font-family="sans-serif" font-size="11">CMA CGM Jacques</text>
    <text x="340" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11">Shanghai &rarr; New York</text>
    <rect x="500" y="68" width="80" height="18" rx="4" fill="rgba(245, 158, 11, 0.15)"/>
    <text x="540" y="81" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">CUSTOMS</text>
  </g>
</svg>
