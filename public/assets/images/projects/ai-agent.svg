<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070614" />
      <stop offset="50%" stop-color="#140c24" />
      <stop offset="100%" stop-color="#060512" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="aiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#aiBg)" rx="16"/>

  <circle cx="400" cy="250" r="190" fill="#ec4899" opacity="0.08" filter="url(#aiGlow)"/>
  <circle cx="400" cy="250" r="90" fill="#00f2fe" opacity="0.1" filter="url(#aiGlow)"/>

  <!-- Top bar -->
  <rect x="40" y="35" width="720" height="45" rx="10" fill="#100c22" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1"/>
  <circle cx="65" cy="58" r="5" fill="#ef4444" />
  <circle cx="82" cy="58" r="5" fill="#eab308" />
  <circle cx="99" cy="58" r="5" fill="#10b981" />
  <text x="130" y="62" fill="#fff" font-family="sans-serif" font-weight="bold" font-size="13">NEXUS AI PROMPT STUDIO &amp; AUTONOMOUS ORCHESTRATOR</text>

  <!-- Node Pipeline Canvas -->
  <g transform="translate(60, 100)">
    <!-- Connection Cables -->
    <path d="M 170,120 C 230,120 230,60 290,60" fill="none" stroke="url(#neonPink)" stroke-width="3" filter="url(#aiGlow)"/>
    <path d="M 170,120 C 230,120 230,180 290,180" fill="none" stroke="url(#neonCyan)" stroke-width="3" filter="url(#aiGlow)"/>
    <path d="M 450,60 C 510,60 510,120 570,120" fill="none" stroke="url(#neonPink)" stroke-width="2.5"/>
    <path d="M 450,180 C 510,180 510,120 570,120" fill="none" stroke="url(#neonCyan)" stroke-width="2.5"/>

    <!-- Node 1: Input Trigger -->
    <rect x="10" y="80" width="160" height="85" rx="10" fill="#130e28" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="22" y="92" width="60" height="18" rx="4" fill="rgba(139, 92, 246, 0.2)"/>
    <text x="28" y="105" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10">TRIGGER</text>
    <text x="22" y="130" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">User PDF Upload</text>
    <text x="22" y="148" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Multipart / Stream</text>

    <!-- Node 2: Gemini 1.5 Multimodal -->
    <rect x="290" y="20" width="160" height="85" rx="10" fill="#130e28" stroke="#ec4899" stroke-width="1.5"/>
    <rect x="302" y="32" width="75" height="18" rx="4" fill="rgba(236, 72, 153, 0.2)"/>
    <text x="308" y="45" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="10">GEMINI 1.5</text>
    <text x="302" y="70" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">Semantic Parse</text>
    <text x="302" y="88" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="10">1M Context Window</text>

    <!-- Node 3: Vector Embeddings / RAG -->
    <rect x="290" y="140" width="160" height="85" rx="10" fill="#130e28" stroke="#00f2fe" stroke-width="1.5"/>
    <rect x="302" y="152" width="80" height="18" rx="4" fill="rgba(0, 242, 254, 0.2)"/>
    <text x="308" y="165" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="10">PGVECTOR</text>
    <text x="302" y="190" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">Cosine Similarity</text>
    <text x="302" y="208" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Top-5 nearest nodes</text>

    <!-- Node 4: Synthesis & Action -->
    <rect x="570" y="80" width="160" height="85" rx="10" fill="#130e28" stroke="#10b981" stroke-width="1.5"/>
    <rect x="582" y="92" width="70" height="18" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="588" y="105" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">GPT-4o</text>
    <text x="582" y="130" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">JSON Enforcement</text>
    <text x="582" y="148" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Deterministic Schema</text>
  </g>

  <!-- Live Output Console -->
  <g transform="translate(60, 360)">
    <rect x="0" y="0" width="680" height="85" rx="8" fill="#0c0a1b" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="16" y="24" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="10">> [STREAM 200 OK] Agent synthesized payload with 0 hallucinations in 340ms.</text>
    <text x="16" y="44" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">> Tokens: 412 in / 158 out | Cost: $0.0021 | Status: Dispatched to destination API webhook.</text>
    <rect x="16" y="56" width="300" height="12" rx="6" fill="#1b1636"/>
    <rect x="16" y="56" width="280" height="12" rx="6" fill="url(#neonPink)"/>
  </g>
</svg>
